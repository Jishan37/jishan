  <!-- Contact Section -->

    <h1>Contact Me</h1>
    <p class="contact-intro">Feel free to reach out for collaboration, project inquiries, or just to connect!</p>

    <div class="contact-wrapper">
      <!-- Contact Info -->
      <div class="contact-info">
        <h2>Get In Touch</h2>
        <p><i class="fas fa-envelope"></i> mdjas005@gmail.com</p>
        <p><i class="fas fa-phone"></i> +8801881381698</p>

        <div class="social-links">

      <!-- Contact Form -->
      <div class="contact-form-container">
        <form id="contact-form" class="contact-form">
          <input type="text" name="from_name" placeholder="Your Name" required />
          <input type="email" name="from_email" placeholder="Your Email" required />
          <input type="text" name="subject" placeholder="Subject" />
          <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
          <button type="submit" class="btn">Send Message</button>
          <p id="form-status"></p>
        </form>
      </div>
    </div>
  </section>

  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
  // Initialize EmailJS
  emailjs.init("6L6GwluaFHk_PTLL4"); // Your Public Key

  document.getElementById("contact-form").addEventListener("submit", function(event) {
    event.preventDefault();

    emailjs.sendForm("service_twokm4b", "template_gt825o9", this)
      .then(function() {
        document.getElementById("form-status").innerText = "✅ Message sent successfully!";
        document.getElementById("form-status").style.color = "lightgreen";
      }, function(error) {
        console.error("EmailJS Error:", error); // Shows error details in console
        document.getElementById("form-status").innerText = "❌ Failed to send message. Try again!";
        document.getElementById("form-status").style.color = "red";
      });
  });
</script>
